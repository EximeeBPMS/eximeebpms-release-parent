project:
  name: eximeebpms-release-parent
  description: Release parent POM for EximeeBPMS projects
  links:
    homepage: https://eximeebpms.org
  languages:
    java:
      groupId: org.eximeebpms
      version: '17'

deploy:
  maven:
    mavenCentral:
      MavenCentral:
        active: RELEASE
        applyMavenCentralRules: true
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - target/staging-deploy
        retryDelay: 30
        maxRetries: 99
